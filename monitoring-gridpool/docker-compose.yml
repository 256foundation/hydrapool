services:
  prometheus:
    image: ghcr.io/256foundation/hydrapool-prometheus:latest
    container_name: gridpool-hydrapool-prometheus
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.custom.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-admin-api"
      - "--web.listen-address=127.0.0.1:9090"
      - "--storage.tsdb.retention.time=15d"
      - "--storage.tsdb.retention.size=10GB"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  grafana:
    image: ghcr.io/256foundation/hydrapool-grafana:latest
    container_name: gridpool-hydrapool-grafana
    restart: unless-stopped
    network_mode: host
    depends_on:
      prometheus:
        condition: service_healthy
    volumes:
      - ./grafana-datasource.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-gridpool-beta-local}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/dashboards/pool.json
      - GF_SERVER_DOMAIN=${GRAFANA_BIND_IP:-100.86.192.114}
      - GF_SERVER_HTTP_ADDR=${GRAFANA_BIND_IP:-100.86.192.114}
      - GF_SERVER_HTTP_PORT=${GRAFANA_PORT:-3300}
      - GF_SERVER_ROOT_URL=http://${GRAFANA_BIND_IP:-100.86.192.114}:${GRAFANA_PORT:-3300}/

volumes:
  prometheus_data:
  grafana_data:
