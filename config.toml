[store]
path = "./store.db"
background_task_frequency_hours = 24
pplns_ttl_days = 1

[stratum]
hostname = "0.0.0.0"
port = 3333
start_difficulty = 512
minimum_difficulty = 512
maximum_difficulty = 512
# The bitcoin address to use for first jobs when there are no
# shares. The default provided is the 256 Foundation address.
bootstrap_address = "bc1qce93hy5rhg02s6aeu7mfdvxg76x66pqqtrvzs3"
ignore_difficulty = false
# Do not use Hydrapool's normal extra-output donation/fee fields in
# GridPool mode. GridPool validates the shared payout outputs exactly.
#
# Hosted GridPool Stratum fees are implemented by personalized work
# scheduling instead: every Nth job uses gridpool_fee_address as slot 0.
# gridpool_fee_address = "<your GridPool hosted-Stratum fee address>"
# gridpool_fee_every_n_jobs = 50
zmqpubhashblock = "tcp://127.0.0.1:28334"
# The network can be "main", "testnet4" or "signet"
network = "main"
version_mask = "1fffe000"
# The difficulty multiplier defines the window size for calculating payout proportions
# See https://github.com/p2poolv2/p2poolv2/wiki/Difficult-Multiplier on how to choose this
difficulty_multiplier = 1.0
# Add a pool signature, if you want. Comment out the line if you want
# to mine anonymous blocks. This signature is only used to show others
# how large your pool is, if you are running private, there is no need
# to add a pool signature. Maximum length 16 bytes.
pool_signature = "hydrapool"
payout_file_path = "/tmp/hydrapool_gridpool_payouts.json"  # Triggers file mode without modifying tracked examples
downstream_payout_url = "http://127.0.0.1:5000/api/mining/payouts"  # Optional: Enables fetcher
payout_refresh_interval = 30
# Optional high-difficulty share relay (separate from payout URL)
high_diff_share_submit_url = "http://127.0.0.1:5000/api/mining/share"
# Authenticated vardiff accounting for the local GridPool UI. Set
# GRIDPOOL_ADAPTER_TOKEN in the service environment; do not store it here.
gridpool_share_telemetry_url = "http://127.0.0.1:5000/api/mining/local/share-telemetry"
# Target average cadence for share submissions (adaptive difficulty threshold)
high_diff_share_submit_interval_secs = 60
# How often to recompute adaptive submission threshold
high_diff_share_adjust_interval_secs = 60

[bitcoinrpc]
# RPC credentials are loaded from env vars
url = "http://127.0.0.1:8332"
username = "bitcoin"
password = "change-me"

[logging]
# Specify a file path for the log file, if no log file is specified, console logging will be used
# file = "./logs/p2pool.log"
# Set a log level. The supported levels are debug, info, warn and error.
level = "debug"
# Pool, user and worker stats are backed up for aggregates across pool restarts in this directory.
stats_dir = "./logs/stats"

[api]
hostname = "0.0.0.0"
port = 46884
# Optional authentication credentials
auth_user = "hydrapool"
# auth_token is of the format salt:password-hmac. Use can hydrapool_cli gen-auth to generate a token.
auth_token = "0d74058f74ad3b6768493cedb5e9492b$2a2599d5f4003c291e141762d0e43808cfd932f04a8260e94c375d1574599dbf"
