[supervisord]
nodaemon=true
logfile=/data/logs/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/data/logs

[program:hydrapool]
command=/usr/local/bin/hydrapool --config /data/hydrapool/config.toml
user=hydrapool
autorestart=true
startsecs=5
startretries=3
stdout_logfile=/data/logs/hydrapool-stdout.log
stderr_logfile=/data/logs/hydrapool-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
environment=RUST_LOG="%(ENV_RUST_LOG)s"

[program:prometheus]
command=/usr/local/bin/prometheus
    --config.file=/data/prometheus/prometheus.yml
    --storage.tsdb.path=/data/prometheus/data
    --web.enable-admin-api
    --storage.tsdb.retention.time=15d
    --storage.tsdb.retention.size=10GB
    --web.listen-address=0.0.0.0:9090
autorestart=true
startsecs=5
startretries=3
stdout_logfile=/data/logs/prometheus-stdout.log
stderr_logfile=/data/logs/prometheus-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

[program:grafana]
command=/usr/share/grafana/bin/grafana server
    --homepath=/usr/share/grafana
    --config=/data/grafana/grafana.ini
autorestart=true
startsecs=5
startretries=3
stdout_logfile=/data/logs/grafana-stdout.log
stderr_logfile=/data/logs/grafana-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
environment=GF_PATHS_DATA="/data/grafana",GF_PATHS_LOGS="/data/logs",GF_PATHS_PROVISIONING="/etc/grafana/provisioning"
